---
rule_files:
  - ../build/rules/certificates.yaml

evaluation_interval: 5m

tests:
  # promtool time starts at 0 (1970-01-01), so expiry timestamps are small numbers.
  - name: expiry thresholds
    interval: 5m
    input_series:
      # expires in 10 days -> warning only
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="web", name="shop-tls"}'
        values: '864000x30'
      # expires in 3 days -> warning and critical
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="web", name="api-tls"}'
        values: '259200x30'
      # expires in 60 days -> nothing
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="web", name="fresh-tls"}'
        values: '5184000x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: CertManagerCertificateExpiryCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: web
              name: api-tls
            exp_annotations:
              description: "Renewal has been failing for weeks; an outage is days away."
              runbook_url: "https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#certificateexpiry"
              summary: "Certificate web/api-tls expires in 2d 22h 0m 0s."
      - eval_time: 2h
        alertname: CertManagerCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: web
              name: shop-tls
            exp_annotations:
              description: "cert-manager should have renewed it already. Check the Certificate, Order and Challenge resources."
              runbook_url: "https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#certificateexpiry"
              summary: "Certificate web/shop-tls expires in 9d 22h 0m 0s."
          - exp_labels:
              severity: warning
              namespace: web
              name: api-tls
            exp_annotations:
              description: "cert-manager should have renewed it already. Check the Certificate, Order and Challenge resources."
              runbook_url: "https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#certificateexpiry"
              summary: "Certificate web/api-tls expires in 2d 22h 0m 0s."

  - name: blackbox probe certificate
    interval: 5m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://status.example.com"}'
        values: '604800x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: TLSEndpointCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://status.example.com
            exp_annotations:
              description: "The endpoint is probed by blackbox-exporter; renew or rotate the certificate."
              runbook_url: "https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#certificateexpiry"
              summary: "TLS certificate for https://status.example.com expires in 6d 22h 0m 0s."
