# Shape of the Secret Alertmanager reads receiver credentials from.
# This file is an EXAMPLE with placeholder values — do not commit real keys.
# In a GitOps setup create it with External Secrets (externalsecret.yaml),
# Sealed Secrets or SOPS instead of applying this file.
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
type: Opaque
stringData:
  pagerduty-routing-key: "REPLACE_ME"
  slack-critical-webhook: "https://hooks.slack.com/services/REPLACE/ME"
  slack-warning-webhook: "https://hooks.slack.com/services/REPLACE/ME"
  deadmansswitch-url: "https://example.invalid/ping/REPLACE_ME"
