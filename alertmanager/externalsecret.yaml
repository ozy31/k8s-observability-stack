# Builds the alertmanager-receivers Secret from AWS Secrets Manager via the
# External Secrets Operator. Requires a ClusterSecretStore named
# "aws-secrets-manager" (IRSA-backed) — not part of this repo.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-receivers
    creationPolicy: Owner
  dataFrom:
    - extract:
        # One JSON secret holding the four keys from secret.example.yaml
        key: observability/alertmanager-receivers
