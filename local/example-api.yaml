# A small instrumented HTTP service plus a load generator, so the SLO rules
# and the SLO dashboard have real data locally. The Service is called
# example-api, so Prometheus sets job="example-api" on its metrics.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: demo
  labels:
    app.kubernetes.io/name: example-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-api
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.6.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: example-api
  namespace: demo
  labels:
    app.kubernetes.io/name: example-api
spec:
  selector:
    app.kubernetes.io/name: example-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: example-api
  namespace: demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  endpoints:
    - port: http
      interval: 30s
---
# Load generator. One request in ERROR_EVERY goes to /internal-err (HTTP 500).
# The default of 500 (0.2% errors, burn rate 2) stays below every paging
# threshold. Set it to 50 (2%, burn rate 20) to watch SLOErrorBudgetBurnFast
# fire within a few minutes:
#   kubectl -n demo set env deploy/loadgen ERROR_EVERY=50
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          env:
            - name: ERROR_EVERY
              value: "500"
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                if [ $((i % ERROR_EVERY)) -eq 0 ]; then path=/internal-err; else path=/; fi
                curl -s -o /dev/null -w "%{http_code} $path\n" http://example-api.demo:8080$path
                sleep 0.1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
