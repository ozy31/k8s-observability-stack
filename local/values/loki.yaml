# Single-binary Loki on the local filesystem: no object storage, no IRSA.
---
deploymentMode: SingleBinary

serviceAccount:
  annotations: {}

loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 72h

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  replicas: 1

chunksCache:
  enabled: false
resultsCache:
  enabled: false
