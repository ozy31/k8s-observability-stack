# Grafana Alloy — DaemonSet that tails container logs on each node and ships
# them to Loki. (Promtail is in end-of-life; Alloy is its replacement.)
#
# Label policy (see README "Loki label cardinality"):
#   stream labels  -> cluster, namespace, app, container, pod
#   everything else (trace_id, user, status code, path, ...) stays in the log
#   line and is filtered at query time, or goes to structured metadata.
---
controller:
  type: daemonset
  tolerations:
    - operator: Exists  # collect from every node, including tainted ones

alloy:
  mounts:
    varlog: true
  extraEnv:
    - name: CLUSTER_NAME
      value: prod-eu-1
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Only discover pods scheduled on this node.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Opt-out per pod with the annotation logs.alloy/scrape: "false".
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_logs_alloy_scrape"]
          regex         = "false"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app = app.kubernetes.io/name, falling back to the "app" label,
        // falling back to the controller name.
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__meta_kubernetes_pod_controller_name",
          ]
          separator    = ";"
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Parse the CRI log format written by containerd.
        stage.cri {}

        // Pull trace_id out of JSON logs into structured metadata so it is
        // queryable without becoming a stream label.
        // Non-JSON lines are passed through unchanged.
        stage.json {
          expressions = { trace_id = "trace_id" }
        }
        stage.structured_metadata {
          values = { trace_id = "" }
        }
        // loki.source.file adds the log file path as a label: unique per
        // container restart and redundant with namespace/pod/container.
        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        }
        external_labels = {
          cluster = sys.env("CLUSTER_NAME"),
        }
      }

serviceMonitor:
  enabled: true
