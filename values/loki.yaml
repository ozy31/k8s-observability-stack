# Loki — Simple Scalable mode (read / write / backend targets) on S3.
#
# Simple Scalable is the sweet spot for small-to-medium clusters
# (up to roughly 1 TB/day). For very small clusters or local testing use
# deploymentMode: SingleBinary (see values/local/loki.yaml).
#
# S3 access uses IRSA (IAM Roles for Service Accounts): no static keys.
# The IAM role needs s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject
# on both buckets below.
---
deploymentMode: SimpleScalable

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/loki-s3

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: example-loki-chunks
      ruler: example-loki-ruler
    s3:
      region: eu-central-1
      # Credentials come from the web identity token injected by IRSA.
      s3ForcePathStyle: false
      insecure: false
  limits_config:
    retention_period: 744h  # 31 days
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 20MB
    # Guard rail against label-cardinality mistakes in log shippers.
    max_global_streams_per_user: 20000
    max_label_names_per_series: 15
    max_query_series: 1000
    query_timeout: 2m
  compactor:
    retention_enabled: true
    delete_request_store: s3
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true

write:
  replicas: 3
  persistence:
    size: 20Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

read:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

backend:
  replicas: 2
  persistence:
    size: 10Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

gateway:
  enabled: true
  replicas: 2

chunksCache:
  allocatedMemory: 2048
resultsCache:
  allocatedMemory: 512

# Self-monitoring: ServiceMonitors for Loki components.
monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: false
  rules:
    enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

# Not used in Simple Scalable mode.
singleBinary:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
