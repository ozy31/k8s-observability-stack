---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-workloads
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: k8s-observability-stack
spec:
  groups:
    - name: kubernetes-workloads
      rules:
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics", reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping."
            description: >-
              Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
              has been in CrashLoopBackOff for at least 15 minutes.
              Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubepodcrashlooping

        - alert: KubeContainerOOMKilled
          expr: |
            (
              increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[15m]) >= 1
            )
            and on (namespace, pod, container)
            (
              kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"} == 1
            )
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled."
            description: >-
              The container exceeded its memory limit and was restarted in the last
              15 minutes. Compare the limit with working-set usage on the cost dashboard.
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubecontaineroomkilled

        - alert: KubeDeploymentReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas{job="kube-state-metrics"}
                > kube_deployment_status_replicas_available{job="kube-state-metrics"}
            )
            and on (namespace, deployment)
            (
              changes(kube_deployment_status_replicas_updated{job="kube-state-metrics"}[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is missing replicas.
            description: >-
              Fewer replicas are available than desired for 15 minutes and the
              rollout is not progressing.
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubereplicasmismatch

        - alert: KubeStatefulSetReplicasMismatch
          expr: |
            (
              kube_statefulset_replicas{job="kube-state-metrics"}
                > kube_statefulset_status_replicas_ready{job="kube-state-metrics"}
            )
            and on (namespace, statefulset)
            (
              changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics"}[10m]) == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} is missing replicas.
            description: Fewer replicas are ready than desired for 15 minutes and the rollout is not progressing.
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubereplicasmismatch

        - alert: KubeJobFailed
          expr: kube_job_status_failed{job="kube-state-metrics"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed.
            description: >-
              Delete the Job to clear this alert once investigated, or set
              ttlSecondsAfterFinished so failed Jobs are cleaned up automatically.
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubejobfailed

        - alert: KubeHpaMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics"}
              == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} is pinned at max replicas.
            description: >-
              The HPA has been at maxReplicas for 30 minutes; it cannot absorb more
              load. Raise maxReplicas or investigate why load (or per-pod cost) grew.
            runbook_url: https://github.com/ozy31/k8s-observability-stack/blob/main/docs/runbooks.md#kubehpamaxedout
